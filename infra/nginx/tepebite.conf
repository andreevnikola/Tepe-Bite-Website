# TEPE bite reverse proxy — Nginx -> Next.js standalone server on 127.0.0.1:3000.
#
# HTTP only for now. TLS (certbot) is intentionally NOT configured here — it
# is a separate, explicitly-approved step (see docs/deployment.md). Do not add
# a 443 server block or install certbot until that approval happens; doing so
# without DNS pointed at this host will fail ACME validation anyway.

limit_req_zone $binary_remote_addr zone=tepebite_general:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tepebite.eu www.tepebite.eu;

    client_max_body_size 10m;

    access_log /var/log/nginx/tepebite.access.log;
    error_log  /var/log/nginx/tepebite.error.log;

    limit_req zone=tepebite_general burst=40 nodelay;

    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Next.js static build assets are content-hashed — safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
