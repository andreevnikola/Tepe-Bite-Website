# TEPE bite reverse proxy — Nginx -> Next.js standalone server on 127.0.0.1:3000.
#
# Canonical domain: https://tepebite.eu
#   - http://tepebite.eu       -> https://tepebite.eu   (redirect)
#   - http://www.tepebite.eu   -> https://tepebite.eu   (redirect)
#   - https://www.tepebite.eu  -> https://tepebite.eu   (redirect)
# TLS cert covers both tepebite.eu and www.tepebite.eu (SAN), issued by certbot.
# Renewal is handled by the certbot systemd timer.
#
# IMPORTANT: this file is the source of truth and MUST keep the 443 blocks in
# sync with the live server. `bootstrap-vps.sh nginx` overwrites
# /etc/nginx/sites-available/tepebite.conf wholesale, so an HTTP-only version
# here would silently take TLS down the next time that stage is run.

# Normal requests must reach the upstream with an empty Connection header so the
# keepalive pool below is actually used; only a real WebSocket handshake gets
# "upgrade". Sending "upgrade" unconditionally (the previous behaviour) defeated
# upstream keep-alive on every single request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream tepebite_app {
    server 127.0.0.1:3000;
    # Reuse connections to Node instead of a fresh TCP handshake per request.
    keepalive 32;
    keepalive_timeout 60s;
}

# Rate limiting protects the single-CPU Node process, so it is applied to the
# *dynamic* location only. It deliberately does not throttle /_next/static: one
# cold page load pulls ~35 content-hashed asset files plus images in a single
# burst, and mobile carriers put many subscribers behind one CGNAT address.
# Under the old server-level "20r/s burst=40" that combination reliably tripped
# the limiter and returned 503 for a chunk of the assets — which breaks
# client-side navigation for the rest of the session.
limit_req_zone $binary_remote_addr zone=tepebite_dynamic:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tepebite_assets:10m rate=200r/s;

# ─── HTTP (80) — both hostnames redirect to the canonical HTTPS apex ─────────
server {
    listen 80;
    listen [::]:80;
    server_name tepebite.eu www.tepebite.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://tepebite.eu$request_uri;
    }
}

# ─── HTTPS (443) — www redirects to the canonical apex ──────────────────────
server {
    # nginx 1.24 (Ubuntu 24.04) predates the separate `http2 on;` directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tepebite.eu;

    ssl_certificate     /etc/letsencrypt/live/tepebite.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tepebite.eu/privkey.pem;

    return 301 https://tepebite.eu$request_uri;
}

# ─── HTTPS (443) — canonical apex, serves the app ────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tepebite.eu;

    ssl_certificate     /etc/letsencrypt/live/tepebite.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tepebite.eu/privkey.pem;

    client_max_body_size 10m;

    access_log /var/log/nginx/tepebite.access.log;
    error_log  /var/log/nginx/tepebite.error.log;

    # The Next standalone server only compresses what it renders (HTML/RSC); it
    # serves .next/static files uncompressed. Ubuntu's stock nginx.conf has
    # `gzip on` but leaves gzip_types and gzip_proxied at their defaults
    # (text/html only, and "off" = never compress a proxied response), so the JS
    # and CSS bundles were going over the wire raw — ~350 KB per cold load.
    gzip              on;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    location = /api/health {
        proxy_pass http://tepebite_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection $connection_upgrade;
        access_log off;
    }

    # Next.js static build assets are content-hashed — safe to cache forever.
    # Effectively unthrottled: cheap, immutable, and requested in bursts.
    location /_next/static/ {
        limit_req zone=tepebite_assets burst=200 nodelay;
        proxy_pass http://tepebite_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection $connection_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimised images cost real CPU on first generation but are cached on disk
    # afterwards, and a gallery page requests many of them at once.
    location /_next/image {
        limit_req zone=tepebite_assets burst=100 nodelay;
        proxy_pass http://tepebite_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        limit_req zone=tepebite_dynamic burst=60 nodelay;
        proxy_pass http://tepebite_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
